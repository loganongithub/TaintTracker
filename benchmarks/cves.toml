# ---------------------------------------------------------------------
# Held-out set. Added on 2026-11-13 after the engine was adjusted against
# the cases above. Do not change engine rules to make these pass without
# recording it in DECISIONS.md: their value is that the engine has never
# been tuned on them.
#
# All are from the CVE-2022-315xx batch (unsafe Flask send_file).
# Cases with only `vulnerable` were never fixed upstream according to OSV;
# they are pinned at the head commit as of 2026-11-13, and nobody has
# confirmed the bug is still present at that commit. Their `files` were
# filled in after the first held-out run, by reading where each repository
# calls send_file. That first run used a repository-level match and wrongly
# credited dls, whose vulnerable file is Python 2 and was skipped.
# ---------------------------------------------------------------------

[[case]]
