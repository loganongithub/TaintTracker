repo = "https://github.com/sujeetkv/flaskcode"
vulnerable = "05a9d61c482f35d13480ba5337ef2ffe6072cae5"

  [[case.cve]]
  id = "CVE-2023-52288"
  rule = "path-traversal"
  note = "GET /resource-data/<file_path> reads an arbitrary file; no fixed release"
  files = ["flaskcode/views.py", "flaskcode/utils.py"]

  [[case.cve]]
  id = "CVE-2023-52289"
  rule = "path-traversal"
  note = "POST /update-resource-data/<file_path> writes an arbitrary file; no fixed release"
  files = ["flaskcode/views.py", "flaskcode/utils.py"]

